name: Publish standalone image

# Builds the Yuvomi add-on image for the portable stack (marcomow/home-agents-stack)
# and publishes it to GHCR for amd64 and arm64, so hosts pull instead of build.
on:
  push:
    paths: ["yuvomi/**", ".github/workflows/image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read add-on version
        id: v
        run: echo "version=$(grep -E '^version:' yuvomi/config.yaml | tr -d '"' | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: yuvomi
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/yuvomi-ha:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/yuvomi-ha:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
