name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  addon-lint:
    name: Add-on lint (yuvomi)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Home Assistant add-on lint
        uses: frenck/action-addon-linter@v2
        with:
          path: ./yuvomi
